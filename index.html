<!DOCTYPE html>
<html>
<head><title>BASIC Line Editor (teven)</title>
<style>
body { font-family: monospace; background: #000; color: #0f0; padding: 20px; }
textarea { background: #111; color: #0f0; border: 1px solid #0f0; width: 100%; height: 400px; font-size: 14px; }
input, button { background: #222; color: #0f0; border: 1px solid #0f0; padding: 8px; margin: 5px; }
button { cursor: pointer; }
#output { margin-top: 10px; color: #ff0; }
.url-input { width: 60%; }
</style></head>
<body>
<h1>BASIC Line Editor (teven)</h1>

<!-- New Input for Remote URL -->
<div>
    <label>Source URL (Optional):</label>
    <input id="sourceUrl" class="url-input" placeholder="https://raw.githubusercontent.com/user/repo/main/basic.bas" />
    <button onclick="loadFromUrl()">Load Source</button>
</div>
<br>

<textarea id="code">10 PRINT "HELLO WORLD"
20 FOR I = 1 TO 10
30 PRINT I
40 NEXT I
50 END
</textarea><br>
<div>
    <input id="range" placeholder="1010-1050" />
    <input id="newcode" placeholder="1010 PRINT 42" />
    <button onclick="editLines()">Rewrite Range</button>
</div>
<pre id="output"></pre>

<script>
let currentCode = document.getElementById('code');
let output = document.getElementById('output');

async function loadFromUrl() {
  const urlInput = document.getElementById('sourceUrl').value.trim();
  // If no URL is provided, try to fetch a local file named basic.bas
  const targetUrl = urlInput ? urlInput : '/basic.bas';
  
  output.textContent = `Loading: ${targetUrl}...`;

  try {
    const res = await fetch(targetUrl);
    if (!res.ok) throw new Error(`HTTP ${res.status}`);
    
    const text = await res.text();
    currentCode.value = text;
    output.textContent = `Loaded successfully (${text.length} bytes)`;
  } catch(e) {
    output.textContent = `Error: ${e.message}. Ensure the URL is a 'raw' link and supports CORS.`;
    console.error(e);
  }
}

function parseLines(text) {
  return text.split('\n').map((line, i) => {
    const match = line.match(/^(\d+)\s*(.*)$/);
    return { num: match ? parseInt(match[1]) : i+1, full: line.trim() };
  }).filter(l => l.full);
}

function editLines() {
  const lines = parseLines(currentCode.value);
  const rangeVal = document.getElementById('range').value;
  const newCode = document.getElementById('newcode').value;

  if (!rangeVal || !rangeVal.includes('-')) {
      output.textContent = 'Error: Please enter a valid range (e.g. 10-20)';
      return;
  }
  
  const [start, end] = rangeVal.split('-').map(Number);
  
  const updated = lines.map(line => {
    if (line.num >= start && line.num <= end) {
      return { num: line.num, full: `${line.num} ${newCode}` };
    }
    return line;
  });
  
  currentCode.value = updated.map(l => l.full).join('\n');
  output.textContent = `Updated lines ${start}-${end} with "${newCode}"`;
}
</script>
</body>
</html>
