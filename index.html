<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mistral Chatbot</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            max-width: 600px;
            margin: 0 auto;
            padding: 20px;
        }
        #chatbox {
            border: 1px solid #ccc;
            border-radius: 5px;
            padding: 10px;
            height: 300px;
            overflow-y: scroll;
            margin-bottom: 10px;
        }
        #userInput {
            width: 70%;
            padding: 8px;
        }
        button {
            padding: 8px 15px;
            background-color: #007BFF;
            color: white;
            border: none;
            border-radius: 4px;
            cursor: pointer;
        }
        .user-message, .bot-message {
            margin: 5px 0;
            padding: 8px;
            border-radius: 4px;
        }
        .user-message {
            background-color: #e3f2fd;
            text-align: right;
        }
        .bot-message {
            background-color: #f1f1f1;
            text-align: left;
        }
    </style>
</head>
<body>
    <h1>Mistral Chatbot</h1>
    <div id="chatbox"></div>
    <input type="text" id="userInput" placeholder="Type your message...">
    <button onclick="sendMessage()">Send</button>

    <script>
        const chatbox = document.getElementById('chatbox');
        const userInput = document.getElementById('userInput');
        const API_KEY = 'qnFewBCsAU7ud1p3I0Vb7wUxQNAyVa0w'; // Your Mistral API key

        async function sendMessage() {
            const message = userInput.value.trim();
            if (message === '') return;

            // Display user message
            appendMessage('You', message, 'user-message');
            userInput.value = '';

            try {
                // Call Mistral API
                const response = await fetch('https://api.mistral.ai/v1/chat/completions', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                        'Authorization': `Bearer ${API_KEY}`
                    },
                    body: JSON.stringify({
                        model: 'mistral-tiny', // or 'mistral-small', 'mistral-medium', etc.
                        messages: [
                            { role: 'user', content: message }
                        ]
                    })
                });

                const data = await response.json();
                const botResponse = data.choices[0].message.content;

                // Display bot response
                appendMessage('Bot', botResponse, 'bot-message');
            } catch (error) {
                console.error('Error:', error);
                appendMessage('Bot', 'Sorry, I encountered an error.', 'bot-message');
            }
        }

        function appendMessage(sender, message, className) {
            const messageElement = document.createElement('div');
            messageElement.className = className;
            messageElement.innerHTML = `<strong>${sender}:</strong> ${message}`;
            chatbox.appendChild(messageElement);
            chatbox.scrollTop = chatbox.scrollHeight;
        }

        // Allow sending messages with Enter key
        userInput.addEventListener('keypress', function(e) {
            if (e.key === 'Enter') {
                sendMessage();
            }
        });
    </script>
</body>
</html>
